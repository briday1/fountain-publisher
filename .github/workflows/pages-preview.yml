name: Writing app checks + production

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: writing-app-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install
        run: npm ci
      - name: Test publication and legacy retirement
        working-directory: .
        run: node --test .github/scripts/*.test.mjs
      - name: Test document, editor, persistence and cloud contracts
        run: npm test
      - name: Browser regression tests
        run: |
          if command -v google-chrome > /dev/null; then
            PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" npm run test:browser
          else
            npx playwright install --with-deps chromium
            npm run test:browser
          fi
      - name: Check private WriteShape build in a mobile browser
        run: |
          npm run build:writeshape
          npx vite preview --host 127.0.0.1 --port 4175 > "$RUNNER_TEMP/writeshape-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          # Fetch fresh signed package indexes from Ubuntu's standard mirrors.
          # A lagging Azure mirror can otherwise retry missing WebKit packages for minutes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' https://archive.ubuntu.com/ubuntu/ https://security.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo find /var/lib/apt/lists -maxdepth 1 -type f -delete
          fi
          npx playwright install --with-deps webkit
          WRITESHAPE_BUILD_SMOKE=1 TEST_BASE_URL=http://127.0.0.1:4175 npx playwright test e2e/writeshape-mobile-smoke.spec.ts e2e/writeshape-ipad-layout.spec.ts e2e/premium-themes.spec.ts --browser webkit
          WRITESHAPE_BUILD_SMOKE=1 TEST_BASE_URL=http://127.0.0.1:4175 npx playwright test e2e/live-collaboration.spec.ts --grep "WriteShape (opens with preview inline|review)" --browser webkit --output test-results/collaboration-mobile
      - name: Keep WriteShape mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writeshape-mobile-smoke
          path: beta/test-results/
          if-no-files-found: ignore
      - name: Build writing app
        run: npm run build:beta
      - name: Validate the publishable artifact and required license files
        run: node ../.github/scripts/prepare-pages.mjs dist "$RUNNER_TEMP/pages-check"
      - name: Validate account adapter without deploying
        run: npx wrangler deploy --dry-run
      - name: Keep the tested build
        uses: actions/upload-artifact@v4
        with:
          name: writing-app
          path: beta/dist
          if-no-files-found: error

  writeshape_private:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - run: npm ci
      - name: Test WriteShape account, billing, access, storage and isolation
        run: node --test cloudflare/writeshape/*.test.mjs
      - name: Build the private WriteShape artifact
        run: npm run build:writeshape
      - name: Validate WriteShape Worker without publishing
        run: npx wrangler deploy --config wrangler.writeshape.json --dry-run

  account_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: github-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-worker/package-lock.json
      - name: Install account Worker dependencies
        run: npm ci
      - name: Test account Worker response boundaries
        run: npm test
      - name: Validate account Worker without deploying
        run: npx wrangler deploy --dry-run

  deploy_writeshape:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, writeshape_private, account_worker]
    uses: ./.github/workflows/writeshape-private-deploy.yml
    secrets: inherit

  deploy_production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, account_worker]
    runs-on: ubuntu-latest
    # Serialize reading the retained publication tree through Cloudflare deployment.
    # Tests run before the lock, and PR checks never update the published site.
    concurrency:
      group: pages-push
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read the tested publication script
        uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: writing-app
          path: out
      - name: Require the repository deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN as a repository secret. Private GitHub Free releases cannot use environment secrets."
            exit 1
          fi
      - name: Install Cloudflare deployment tools
        working-directory: source/beta
        run: npm ci
      - name: Prepare the complete publication tree
        run: |
          node source/.github/scripts/prepare-pages.mjs out published
          node source/.github/scripts/prepare-cloudflare.mjs published source/beta/site-dist "$GITHUB_SHA"
      - name: Validate production hosting without changing account services
        working-directory: source/beta
        run: |
          npx wrangler deploy --config wrangler.fountain.json --dry-run
          npx wrangler deploy --config wrangler.fountain-www.json --dry-run
      - name: Publish Fountain Publisher on Cloudflare
        working-directory: source/beta
        run: npx wrangler deploy --config wrangler.fountain.json
      - name: Retain served assets for already-open writing sessions
        run: |
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets ':(glob)offline-shell-*.html'
          git diff --cached --quiet || git commit -m "Retain served assets from $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - name: Retain the existing www forwarding behavior
        working-directory: source/beta
        run: npx wrangler deploy --config wrangler.fountain-www.json
      - name: Verify every retained publication file on the existing domain
        run: node source/.github/scripts/check-fountain-hosting.mjs https://fountain-publisher.com source/beta/site-dist "$GITHUB_SHA"
      - name: Verify saved drafts, offline use and unchanged account callbacks
        working-directory: source/beta
        env:
          TEST_BASE_URL: https://fountain-publisher.com
        run: |
          if command -v google-chrome > /dev/null; then
            export PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
          fi
          npx playwright test e2e/editor.spec.ts --grep "existing production writing|deployed app exposes Drive|deployed app reopens a saved draft"
      - name: Keep the verified publication snapshot for future releases and rollback
        run: |
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish writing app from $GITHUB_SHA"
          git push origin HEAD:gh-pages
