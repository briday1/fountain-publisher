name: Writing app checks + production

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: writing-app-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install
        run: npm ci
      - name: Test document, editor, persistence and cloud contracts
        run: npm test
      - name: Browser regression tests
        run: |
          if command -v google-chrome > /dev/null; then
            PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" npm run test:browser
          else
            npx playwright install --with-deps chromium
            npm run test:browser
          fi
      - name: Build writing app
        run: npm run build:beta
      - name: Keep the tested build
        uses: actions/upload-artifact@v4
        with:
          name: writing-app
          path: beta/dist
          if-no-files-found: error

  deploy_production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Share the lock with beta.yml from reading gh-pages through Pages deploy.
    # Tests run before the lock, and PR checks never update the published site.
    concurrency:
      group: pages-push
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: writing-app
          path: out
      - name: Publish production while preserving installed clients and previews
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='previews/' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            out/ published/
          touch published/.nojekyll
          if [ ! -s published/CNAME ]; then
            printf '%s\n' 'fountain-publisher.com' > published/CNAME
          fi
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish writing app from $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
