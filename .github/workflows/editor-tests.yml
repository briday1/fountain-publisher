name: Editor Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python application and compiler dependencies
        run: python -m pip install -e .

      - name: Run JavaScript and Python regression tests
        run: npm test

      - name: Build production editor assets
        run: npm run build:web

      - name: Verify the actual browser WebAssembly compiler
        run: npm run test:wasm

      - name: Install Worker dependencies
        working-directory: github-worker
        run: npm ci

      - name: Validate Worker build without deploying
        working-directory: github-worker
        run: npx wrangler deploy --dry-run
