name: Writing-first beta

on:
  push:
    branches: [beta/writing-first]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# This matches the existing main Pages workflow so neither upload races the other.
concurrency:
  group: pages-push
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: https://beta.fountain-publisher.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install
        working-directory: beta
        run: npm ci
      - name: Test document, editor, persistence and cloud contracts
        working-directory: beta
        run: npm test
      - name: Browser regression tests
        working-directory: beta
        run: |
          if command -v google-chrome > /dev/null; then
            PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" npm run test:browser
          else
            npx playwright install --with-deps chromium
            npm run test:browser
          fi
      - name: Build beta
        working-directory: beta
        run: npm run build:beta
      - name: Read the current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Update only the beta preview
        run: |
          mkdir -p published/previews/beta
          rsync -a --delete beta/dist/ published/previews/beta/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/beta
          git diff --cached --quiet || git commit -m "Publish writing-first beta from $GITHUB_SHA"
          git push origin HEAD:gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
      - name: Publish Pages
        uses: actions/deploy-pages@v4
