name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build:web

      - name: Validate Pyodide compile guards
        run: |
          node -e "
          const fs = require('fs');
          const bundle = fs.readFileSync('./dist/web/app.mjs', 'utf8');

          const checks = [
            { pattern: 'hasattr.*slug_style',                    name: 'hasattr guard for slug_style' },
            { pattern: 'getattr.*family_name.*Courier',          name: 'getattr with Courier default for family_name' },
            { pattern: 'getattr.*font_settings.*None',           name: 'getattr with null check for font_settings' },
            { pattern: 'hasattr.*spaceAfter',                    name: 'hasattr guards for spaceAfter assignments' },
          ];

          let ok = true;
          for (const c of checks) {
            if (new RegExp(c.pattern, 's').test(bundle)) {
              console.log('✅ Found: ' + c.name);
            } else {
              console.error('❌ Missing: ' + c.name);
              ok = false;
            }
          }

          process.exit(ok ? 0 : 1);
          "

  deploy:
    needs: [test-compile]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build browser app
        run: npm ci && npm run build:web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
