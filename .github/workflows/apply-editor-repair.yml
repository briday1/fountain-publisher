name: Apply and verify editor repair
on:
  push:
    branches: [fix-dual-dialogue-layout-mobile-format]
    paths: [.github/workflows/apply-editor-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Finish plugin typing and enable visual regression evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('beta/src/editor/dualDialogue.ts')
          s = p.read_text()
          old = 'attributes: (state) => layoutKey.getState(state)?.pairs.length'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'attributes: (state): Record<string, string> => layoutKey.getState(state)?.pairs.length'))
          p = Path('beta/e2e/dual-dialogue-mobile-format.spec.ts')
          s = p.read_text()
          s = s.replace('const modifier =', 'test.use({ screenshot: "on" });\n\nconst modifier =', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta
          git commit -m "Type layout attributes and retain dual-dialogue browser screenshots"
          git push origin HEAD:fix-dual-dialogue-layout-mobile-format
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install
        working-directory: beta
        run: npm ci
      - name: Editor contracts
        working-directory: beta
        run: npm test -- tests/dual-dialogue.test.ts tests/editor.test.ts
      - name: Typecheck and build
        working-directory: beta
        run: npm run build:beta
      - name: Verify real browser layout and mobile controls
        working-directory: beta
        run: |
          if command -v google-chrome > /dev/null; then
            PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" npx playwright test e2e/dual-dialogue-mobile-format.spec.ts e2e/writing-toolbar.spec.ts e2e/mobile-command-panel.spec.ts
          else
            npx playwright install --with-deps chromium
            npx playwright test e2e/dual-dialogue-mobile-format.spec.ts e2e/writing-toolbar.spec.ts e2e/mobile-command-panel.spec.ts
          fi
      - name: Keep browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-regression-evidence
          path: |
            beta/test-results
            beta/playwright-report
          if-no-files-found: ignore
