name: Apply and verify editor repair
on:
  push:
    branches: [fix-dual-dialogue-layout-mobile-format]
    paths: [.github/workflows/apply-editor-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the browser-suite file chooser fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('beta/e2e/dual-dialogue-mobile-format.spec.ts')
          s = p.read_text()
          old = 'async function open(page: Page, text: string) {\n  await page.goto("/");'
          new = '''async function open(page: Page, text: string) {
            await page.addInitScript(() => {
              Object.defineProperty(window, "showOpenFilePicker", {
                value: undefined,
                configurable: true,
              });
              Object.defineProperty(window, "showSaveFilePicker", {
                value: undefined,
                configurable: true,
              });
            });
            await page.goto("/");'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta
          git commit -m "Use native picker fallback in dual-dialogue browser regressions"
          git push origin HEAD:fix-dual-dialogue-layout-mobile-format
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install
        working-directory: beta
        run: npm ci
      - name: Verify real browser layout and mobile controls
        working-directory: beta
        run: |
          if command -v google-chrome > /dev/null; then
            PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" npx playwright test e2e/dual-dialogue-mobile-format.spec.ts e2e/writing-toolbar.spec.ts e2e/mobile-command-panel.spec.ts --reporter=line
          else
            npx playwright install --with-deps chromium
            npx playwright test e2e/dual-dialogue-mobile-format.spec.ts e2e/writing-toolbar.spec.ts e2e/mobile-command-panel.spec.ts --reporter=line
          fi
      - name: Keep browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-regression-evidence
          path: |
            beta/test-results
            beta/playwright-report
          if-no-files-found: ignore
