name: Test Pyodide Compilation

on:
  pull_request:
    branches:
      - main

jobs:
  test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build:web

      - name: Validate Pyodide compile guards
        run: |
          node -e "
          const fs = require('fs');
          // Python now ships in the dedicated worker runtime, never the UI bundle.
          const runtime = fs.readFileSync('./dist/web/compiler-runtime.mjs', 'utf8');
          const ui = fs.readFileSync('./dist/web/app.mjs', 'utf8');

          const checks = [
            { pattern: 'hasattr.*slug_style',                    name: 'hasattr guard for slug_style' },
            { pattern: 'getattr.*family_name.*Courier',          name: 'getattr with Courier default for family_name' },
            { pattern: 'getattr.*font_settings.*None',           name: 'getattr with null check for font_settings' },
            { pattern: 'hasattr.*spaceAfter',                    name: 'hasattr guards for spaceAfter assignments' },
          ];

          let ok = !ui.includes('_fp_compile(');
          if (!ok) console.error('Python compiler unexpectedly returned to the UI bundle');
          for (const c of checks) {
            if (new RegExp(c.pattern, 's').test(runtime)) {
              console.log('✅ Found: ' + c.name);
            } else {
              console.error('❌ Missing: ' + c.name);
              ok = false;
            }
          }

          process.exit(ok ? 0 : 1);
          "
