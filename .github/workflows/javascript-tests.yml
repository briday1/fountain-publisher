name: JavaScript security and regression tests

on:
  pull_request:
    branches: [main, fix/drive-save-location-sharing]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/js/*.test.mjs
