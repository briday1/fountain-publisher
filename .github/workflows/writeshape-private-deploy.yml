name: Deploy private WriteShape

on:
  # The caller supplies the full app/browser/Worker test gate for this revision.
  # Manual releases use pages-preview.yml's workflow_dispatch and the same gate.
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        # The protected environment can supply this instead of a repository secret.
        # The deploy job validates it after environment secrets are resolved.
        required: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"

concurrency:
  group: writeshape-private-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: writeshape-private-test
    defaults:
      run:
        working-directory: beta
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Require private deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret (or the writeshape-private-test environment secret)."
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Test private account and document boundaries
        run: node --test cloudflare/writeshape/*.test.mjs
      - name: Build WriteShape
        run: npm run build:writeshape
      - name: Validate Worker bundle
        run: npx wrangler deploy --config wrangler.writeshape.json --dry-run
      - name: Apply additive account migrations
        run: npx wrangler d1 migrations apply writeshape-documents --remote --config wrangler.writeshape.json
      - name: Deploy private WriteShape
        run: npx wrangler deploy --config wrangler.writeshape.json
      - name: Index earlier live rooms for complete account cleanup
        run: node ../.github/scripts/index-writeshape-rooms.mjs
      - name: Record source revision
        if: success()
        run: echo "Private WriteShape deployed from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed private access and webhook boundaries
        working-directory: .
        run: node .github/scripts/check-writeshape-private.mjs
