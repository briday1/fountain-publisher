[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fountain-publisher"
version = "2026.1"
description = "A source-first Fountain screenplay editor, previewer, and publisher."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Fountain Publisher contributors" }]
dependencies = [
  "screenplain==0.12.0",
  "reportlab==5.0.1",
  "pypdf==6.17.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Topic :: Text Editors",
]

[project.scripts]
fountain-publisher = "fountain_publisher.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fountain_publisher*"]

[tool.setuptools.package-data]
fountain_publisher = ["web/*", "web/fonts/*", "web/icons/*", "web/vendor/*"]
